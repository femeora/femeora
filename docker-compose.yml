services:
  postgres:
    image: postgres:16-alpine
    container_name: fomeora_postgres
    restart: always
    environment:
      POSTGRES_USER: fomeora_user
      POSTGRES_PASSWORD: fomeora_password
      POSTGRES_DB: fomeora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fomeora_user -d fomeora"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fomeora_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: fomeora_anvil
    restart: always
    entrypoint: ["anvil", "--host", "0.0.0.0", "--port", "8545", "--chain-id", "31337"]
    ports:
      - "8545:8545"

volumes:
  postgres_data:
  redis_data:
